{% set resource_types = h.awsis_get_resource_types() %}

<section class="awsis-themes awsis-resource-types">
  <div class="container">
    <div class="awsis-section-header" data-aos="fade-up">
      <h2 class="awsis-section-title">Type of Resource</h2>
      <p class="awsis-section-subtitle">
        Find case studies, guidance and policy material on water security
      </p>
    </div>

    <div class="awsis-themes-grid">
      {% for resource_type in resource_types %}
      <a href="{{ resource_type.link }}" class="awsis-theme-card" data-aos="fade-up" data-aos-delay="{{ loop.index0 * 100 }}">
        <div class="awsis-theme-card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="{{ resource_type.icon or 'M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6z' }}" />
          </svg>
        </div>
        <div class="awsis-theme-card-content">
          <h3 class="awsis-theme-card-title">{{ resource_type.title }}</h3>
          <p class="awsis-theme-card-description">{{ resource_type.description }}</p>
          <span class="awsis-theme-card-link">
            Explore resources
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
          </span>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
